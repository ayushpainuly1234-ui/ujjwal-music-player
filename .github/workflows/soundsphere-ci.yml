name: SoundSphere CI

on:
  push:
    branches: ["main", "feat/full-stack-soundsphere"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: |
          find src test -name '*.js' -type f -print0 | xargs -0 -n1 node --check
      - name: Run validation tests
        run: npm test
